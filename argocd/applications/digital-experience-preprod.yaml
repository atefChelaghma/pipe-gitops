apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: digital-experience-preprod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/atefChelaghma/pipe-gitops.git
    targetRevision: main
    path: k8s/overlays/preprod

  destination:
    server: https://kubernetes.default.svc
    namespace: preprod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true